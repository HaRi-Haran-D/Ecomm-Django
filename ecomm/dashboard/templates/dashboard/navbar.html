<header class="sticky w-full z-20 top-0 start-0 z-10">
	<nav class="bg-violet-200">
		<div class="flex flex-wrap justify-between items-center mx-auto max-w-screen-xl p-2">
			<a href="{% url 'user_dashboard:home' %}" class="flex items-center space-x-3 rtl:space-x-reverse">
				{% comment %} <img src="" class="h-7" alt="Flowbite Logo" /> {% endcomment %}
				<span class="self-center text-xl text-heading font-semibold whitespace-nowrap">ShopMint</span>
			</a>
			<nav class="bg-neutral-secondary-soft">
				<div class="max-w-screen-xl px-4 py-3 mx-auto">
					<div class="flex items-center">
						<ul class="flex flex-row font-medium mt-0 space-x-8 rtl:space-x-reverse text-sm">
							<li>
								<a href="{% url 'user_dashboard:home' %}" class="text-heading hover:underline" aria-current="page">Home</a>
							</li>
							<li>
								<a href="{% url 'user_dashboard:addproduct' %}" class="text-heading hover:underline" aria-current="page">Add</a>
							</li>
							<li>
								<a href="#" class="text-heading hover:underline"><i class="fa-solid fa-cart-shopping"></i> Cart</a>
							</li>
							<li>
								<button 
									data-modal-target="popup-modal" 
									data-modal-toggle="popup-modal"
									class="text-white bg-purple-600 hover:bg-purple-700 focus:ring-4 focus:ring-purple-300 font-medium rounded-lg text-sm px-4 py-2.5">
									Logout
								</button>
								<div id="popup-modal" tabindex="-1" 
								class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm">
									<div class="relative w-full max-w-md p-4">
										<div class="relative bg-white rounded-lg shadow-lg p-6 text-center">

											<!-- Close Button -->
											<button type="button" 
												class="absolute top-3 right-3 text-gray-400 hover:text-gray-700"
												data-modal-hide="popup-modal">
												✕
											</button>

											<!-- Icon -->
											<div class="flex justify-center mb-4">
												<div class="w-12 h-12 flex items-center justify-center rounded-full border-2 border-gray-300 text-gray-500 text-xl">
													!
												</div>
											</div>

											<!-- Text -->
											<h3 class="mb-6 text-gray-700 text-lg font-medium">
												Are you sure you want to log out? <br>
												<span class="text-sm text-gray-500">
													You will need to sign in again to access your account.
												</span>
											</h3>

											<!-- Buttons -->
											<div class="flex justify-center gap-4">

												<!-- ✅ Django Secure Logout -->
												<form action="{% url 'users:logout' %}" method="POST">
													{% csrf_token %}
													<button type="submit"
														class="px-5 py-2 text-white bg-red-600 rounded-lg hover:bg-red-700 focus:ring-4 focus:ring-red-300">
														Yes, log me out
													</button>
												</form>

												<!-- Cancel -->
												<button data-modal-hide="popup-modal"
													class="px-5 py-2 bg-gray-200 rounded-lg hover:bg-gray-300">
													Cancel
												</button>

											</div>
										</div>
									</div>
								</div>
							</li>
							<li>
								<a href="{% url 'users:login' %}" class="text-heading hover:underline">Login</a>
							</li>
						</ul>
					</div>
				</div>
			</nav>
		</div>
	</nav>
</header>
