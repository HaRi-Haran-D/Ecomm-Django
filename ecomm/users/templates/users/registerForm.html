{% extends 'dashboard/base.html' %}
{% block title %}Register Form{% endblock %}
{% block content %}
<section class="bg-gray-100 min-h-fit py-6">
    <div class="max-w-lg mx-auto bg-white border rounded-md shadow-sm p-4">

        <h2 class="text-lg text-center font-semibold text-gray-800 mb-4 border-b pb-2">
            Create Account
        </h2>

        <form method="post" class="space-y-4">
            {% csrf_token %}

            {% for field in form %}
            <div>
                <label class="block text-xs text-gray-600 mb-1">
                    {{ field.label }}
                </label>

                <div class="border border-gray-300 rounded px-2 py-1.5 focus-within:ring-1 focus-within:ring-violet-500">
                    {{ field }}
                </div>

                <!-- Errors -->
                {% if field.errors %}
                <p class="text-xs text-red-500 mt-1">
                    {{ field.errors.0 }}
                </p>
                {% endif %}
            </div>
            {% endfor %}

            <!-- Button -->
            <div class="flex justify-center pt-2">
                <button type="submit"
                    class="bg-violet-600 hover:bg-violet-700 text-white text-sm px-5 py-1.5 rounded shadow-sm">
                    Register
                </button>
            </div>

        </form>

        <!-- Login Link -->
        <p class="text-xs text-center text-gray-500 mt-4">
            Already have an account?
            <a href="#" class="text-violet-600 hover:underline">Login</a>
        </p>

    </div>
</section>
{% endblock %}
